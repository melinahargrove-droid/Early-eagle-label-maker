name: Test label workflows
on:
  pull_request:
  push:
    branches: [main, fix/label-workflows-and-print]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          PRODUCT_LINK_SCREENSHOTS: test-results/product-link
          CUSTOMER_ACCESS_SCREENSHOTS: test-results/customer-access
      - name: Upload size-settings previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: size-settings-previews
          path: test-results/size-settings-*.png
          if-no-files-found: ignore
      - name: Upload name-only label previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: name-only-label-previews
          path: test-results/name-only-*.png
          if-no-files-found: ignore
      - name: Upload Product Link previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-link-previews
          path: test-results/product-link/*.png
          if-no-files-found: ignore
      - name: Upload customer-access failure previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-access-previews
          path: test-results/customer-access/*.png
          if-no-files-found: ignore

  manual-first-browsers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Exercise manual-first credit flows with synthetic data
        run: |
          node tests/manual-translation-browser.cjs
          node tests/owner-ai-browser.cjs
        env:
          BROWSER_ENGINE: ${{ matrix.browser }}
      - name: Exercise the isolated private-preview adapter
        run: |
          mkdir -p tests/private-preview/dist
          python3 tests/private-preview/adapter/assemble.py "$PWD" "$GITHUB_SHA"
          node tests/private-preview/tests/static-isolation.cjs
          node tests/private-preview/tests/preview-dom.cjs
          node tests/private-preview/tests/preview-browser.cjs
        env:
          BROWSER_ENGINE: ${{ matrix.browser }}
      - name: Upload owner-AI browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-ai-${{ matrix.browser }}
          path: test-results/owner-ai/${{ matrix.browser }}/
          if-no-files-found: ignore
      - name: Upload private-preview browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-preview-${{ matrix.browser }}
          path: tests/private-preview/test-results/${{ matrix.browser }}/
          if-no-files-found: ignore
      - name: Upload manual-first browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-first-${{ matrix.browser }}
          path: test-results/manual-first/${{ matrix.browser }}/
          if-no-files-found: ignore

  owner-edge-deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check owner-guarded functions without running providers
        run: deno check --node-modules-dir=none supabase/functions/*/index.ts
      - name: Exercise native network adapter with mocked transports and no runtime permissions
        run: deno run tests/product-link-deno-smoke.ts
