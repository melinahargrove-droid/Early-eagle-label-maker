name: Test label workflows
on:
  pull_request:
  push:
    branches: [main, fix/label-workflows-and-print]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Upload size-settings previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: size-settings-previews
          path: test-results/size-settings-*.png
          if-no-files-found: ignore
