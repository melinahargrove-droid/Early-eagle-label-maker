<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Little Labels Button Test</title><style>*{box-sizing:border-box}body{margin:0;background:#FCF8F0;color:#17375E;font-family:Arial,sans-serif;padding:24px}.wrap{max-width:520px;margin:auto}.card{background:#FFFDF9;border:1px solid #DDE6EC;border-radius:24px;padding:20px;margin:14px 0;box-shadow:0 8px 24px rgba(23,55,94,.06)}h1{font-family:Georgia,serif;font-weight:500}button{width:100%;border:1px solid #DDE6EC;border-radius:20px;padding:20px;margin:10px 0;background:#EEF7FD;color:#17375E;font:800 18px Arial;touch-action:manipulation}.ok{background:#EDF7EF;color:#315E42}.bad{background:#FCEDEC;color:#8B4D49}.small{color:#61758A;font-size:14px;line-height:1.45}</style></head><body><div class="wrap"><div class="card"><h1>Little Labels Tap Test ♡</h1><p class="small">This page contains no Little Labels app code, no service worker, no overlays, and no external scripts.</p><button id="tap">Tap This Button</button><div id="result" class="card small">Waiting for a tap…</div></div></div><script>const b=document.getElementById('tap'),r=document.getElementById('result');let n=0;function hit(kind){n++;r.className='card ok';r.textContent='✓ Tap received ('+kind+'). Count: '+n;b.textContent='It works — tap again';}b.addEventListener('click',()=>hit('click'));b.addEventListener('pointerdown',()=>{r.className='card ok';r.textContent='✓ Pointer down received. Release your finger to complete the click.'},{passive:true});document.addEventListener('touchstart',e=>{if(e.target===b){r.className='card ok';r.textContent='✓ Touch start received.'}},{passive:true});</script></body></html>
